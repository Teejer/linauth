[package]
name = "linauth"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
hmac = "0.13.0"
libadwaita = { version = "0.9.2", features = ["v1_8"] }
getrandom = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
urlencoding = "2.1.3"
zeroize = "1.9.1"
zip = { version = "2.4.2", features = ["aes-crypto"] }
